name: EGX Daily Scraper

on:
  schedule:
    # Sun-Thu 14:30 UTC = 16:30 Cairo (winter) / 17:30 (summer), after the close
    - cron: "30 14 * * 0,1,2,3,4"
  workflow_dispatch:

permissions:
  contents: write

concurrency:
  group: egx-daily-scraper
  cancel-in-progress: false

jobs:
  scrape:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"
      - name: Install
        run: |
          pip install -r requirements.txt
          playwright install chromium
          playwright install-deps chromium
      - name: Run scraper
        run: python scraper.py
      - name: Commit data
        run: |
          git config user.name  "github-actions[bot]"
          git config user.email "github-actions[bot]@users.noreply.github.com"
          git add EGX_History.csv EGX_Instruments.csv EGX_Indices.csv
          git diff --cached --quiet || git commit -m "EGX data $(TZ=Africa/Cairo date +'%Y-%m-%d')"
          git push
          
